<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAARTHI Music Therapy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='songs.css') }}">
</head>
<body>
    <main class="music-page">
        <section class="music-shell">
            <div class="music-copy">
                <p class="eyebrow">Music therapy</p>
                <h1>A softer soundtrack for the feeling you are carrying.</h1>
                <p class="section-intro">
                    SAARTHI matched a track to the latest saved emotion from your mood check.
                </p>
                <div class="now-playing">
                    <h3>{{ statement }}</h3>
                </div>
                <div class="player-controls">
                    <a href="/get_music" class="control-btn">Change song</a>
                    <a href="https://open.spotify.com/track/{{ spotify_id }}" target="_blank" rel="noopener noreferrer" class="control-btn alt-btn">Open in Spotify</a>
                    <a href="{{ url_for('main.homepage') }}" class="control-btn ghost-btn">Back to home</a>
                </div>
            </div>

            <div class="music-player">
                {% if spotify_url %}
                <iframe
                    id="spotify-player"
                    src="{{ spotify_url }}"
                    width="100%"
                    height="352"
                    frameborder="0"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
                </iframe>
                {% else %}
                <div class="fallback-message">
                    <p>{{ statement }}</p>
                    <a href="/get_music" class="control-btn">Try again</a>
                </div>
                {% endif %}
            </div>
        </section>
    </main>
</body>
</html>
