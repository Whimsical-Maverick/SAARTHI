<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAARTHI Support Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='chat.css') }}">
</head>
<body>
  <main class="chat-page">
    <section class="chat-container">
      <header class="chat-header">
        <div class="chat-header-title">
          <img src="{{ url_for('static', filename='assets/Gemini_Generated_Image_j5dluuj5dluuj5dl.png') }}" alt="SAARTHI icon">
          <div>
            <p class="eyebrow">Support companion</p>
            <h3>Talk with SAARTHI</h3>
          </div>
        </div>
        <div class="status">
          <a href="{{ url_for('main.homepage') }}" id="go-back">Back to home</a>
          <span class="live-pill">Online</span>
        </div>
      </header>

      <div class="chat-body">
        <div class="message-bubble">
          Hello. I am here with you. Share whatever feels most present right now, and we can take it one step at a time.
        </div>
      </div>

      <div class="chat-footer">
        <input id="input" type="text" placeholder="Type what you are feeling..." />
        <button id="submit" aria-label="Send message">Send</button>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
